<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @media (max-width: 768px) {
            table {
                font-size: 0.875rem;
            }
            th, td {
                padding: 0.5rem !important;
            }
        }
        @media (max-width: 480px) {
            table {
                font-size: 0.75rem;
            }
            th, td {
                padding: 0.25rem !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto p-3 md:p-6">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl md:text-4xl font-bold text-slate-800">
                🎯 Lottery Tracker
            </h1>
            <p class="text-gray-600 text-sm mt-1">Monitor de coincidencias en tiempo real</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
            <div class="bg-white p-4 md:p-6 rounded-lg shadow-md hover:shadow-lg transition">
                <div class="text-gray-500 text-xs md:text-sm font-medium">
                    Estado
                </div>
                <div id="estado"
                    class="text-xl md:text-3xl font-bold text-green-600 mt-2">
                    ACTIVO
                </div>
            </div>

            <div class="bg-white p-4 md:p-6 rounded-lg shadow-md hover:shadow-lg transition">
                <div class="text-gray-500 text-xs md:text-sm font-medium">
                    Placa
                </div>
                <div id="placa"
                    class="text-xl md:text-3xl font-bold text-blue-600 mt-2">
                    HGS22E
                </div>
            </div>

            <div class="bg-white p-4 md:p-6 rounded-lg shadow-md hover:shadow-lg transition">
                <div class="text-gray-500 text-xs md:text-sm font-medium">
                    Última revisión
                </div>
                <div id="revision"
                    class="text-lg md:text-xl font-semibold mt-2">
                    -
                </div>
            </div>

            <div class="bg-white p-4 md:p-6 rounded-lg shadow-md hover:shadow-lg transition">
                <div class="text-gray-500 text-xs md:text-sm font-medium">
                    Coincidencias hoy
                </div>
                <div id="total"
                    class="text-xl md:text-3xl font-bold text-purple-600 mt-2">
                    0
                </div>
            </div>
        </div>

        <!-- Números Monitoreados -->
        <div class="bg-white rounded-lg shadow-md p-4 md:p-6 mb-6">
            <h2 class="text-lg md:text-xl font-bold mb-4 text-slate-800">
                📊 Números monitoreados
            </h2>
            <div id="numeros" class="flex flex-wrap gap-2 md:gap-4">
                <span class="bg-blue-100 text-blue-800 px-3 py-2 rounded-full font-semibold">022</span>
                <span class="bg-blue-100 text-blue-800 px-3 py-2 rounded-full font-semibold">220</span>
                <span class="bg-blue-100 text-blue-800 px-3 py-2 rounded-full font-semibold">22</span>
            </div>
        </div>

        <!-- Tabla de Resultados -->
        <div class="bg-white rounded-lg shadow-md p-4 md:p-6 mb-6 overflow-x-auto">
            <h2 class="text-lg md:text-xl font-bold mb-4 text-slate-800">
                🎲 Resultados detectados
            </h2>
            <table class="w-full text-left">
                <thead>
                    <tr class="border-b-2 border-slate-300 bg-slate-50">
                        <th class="px-2 md:px-4 py-2 md:py-3 font-semibold text-slate-700">Fecha</th>
                        <th class="px-2 md:px-4 py-2 md:py-3 font-semibold text-slate-700">Placa</th>
                        <th class="px-2 md:px-4 py-2 md:py-3 font-semibold text-slate-700">Lotería</th>
                        <th class="px-2 md:px-4 py-2 md:py-3 font-semibold text-slate-700">Número</th>
                    </tr>
                </thead>
                <tbody id="tabla">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
        </div>

        <!-- Resumen Diario -->
        <div class="bg-white rounded-lg shadow-md p-4 md:p-6">
            <h2 class="text-lg md:text-xl font-bold mb-4 text-slate-800">
                📋 Resumen diario
            </h2>
            <div id="resumen" class="text-gray-600">
                Sin datos
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-800 text-white text-center py-4 mt-8">
        <p class="text-xs md:text-sm">
            Lottery Tracker v1.0 • Actualizado cada 10 segundos
        </p>
    </footer>

    <script src="dashboard.js"></script>
</body>
</html>

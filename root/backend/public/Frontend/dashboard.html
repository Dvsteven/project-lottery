<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Lottery Tracker - Monitor de coincidencias en tiempo real. Rastrea números de loterías automáticamente.">
<meta name="keywords" content="lottery tracker, loterías, monitor en tiempo real, coincidencias">
<meta name="theme-color" content="#10b981">

<!-- Favicon SVG -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2310b981' width='100' height='100' rx='20'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='white'>🎯</text></svg>">

<title>
🎯 Lottery Tracker - Monitor de Loterías
</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<h1 class="text-4xl font-bold mb-6">

🎯 Lottery Tracker

</h1>

<div class="grid grid-cols-4 gap-4 mb-6">

<div class="bg-white p-4 rounded shadow">

<div class="text-gray-500">
Estado
</div>

<div id="estado"
class="text-2xl font-bold text-green-600">

ACTIVO

</div>

</div>

<div class="bg-white p-4 rounded shadow">

<div class="text-gray-500">
Placa
</div>

<div id="placa"
class="text-2xl font-bold">

HGS22E

</div>

</div>

<div class="bg-white p-4 rounded shadow">

<div class="text-gray-500">
Última revisión
</div>

<div id="revision"
class="text-xl">

-

</div>

</div>

<div class="bg-white p-4 rounded shadow">

<div class="text-gray-500">
Coincidencias hoy
</div>

<div id="total"
class="text-2xl font-bold">

0

</div>

</div>

</div>

<div class="bg-white p-6 rounded shadow mb-6">

<h2 class="text-xl font-bold mb-4">

Números monitoreados

</h2>

<div id="numeros"
class="flex gap-4 text-2xl">

022
220
22

</div>

</div>

<div class="bg-white p-6 rounded shadow mb-6">

<h2 class="text-xl font-bold mb-4">

Resultados detectados

</h2>

<table class="w-full">

<thead>

<tr class="border-b">

<th>Fecha</th>
<th>Placa</th>
<th>Lotería</th>
<th>Número</th>

</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>

</div>

<div class="bg-white p-6 rounded shadow">

<h2 class="text-xl font-bold mb-4">

Resumen diario

</h2>

<div id="resumen">

Sin datos

</div>

</div>

</div>

<script src="dashboard.js"></script>

</body>

</html>
